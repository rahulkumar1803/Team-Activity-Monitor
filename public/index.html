<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Activity Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- THEME TOGGLE FLOATING BUTTON -->
    <div class="theme-toggle" onclick="toggleTheme()">
        <div class="toggle-circle"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <img src="https://img.icons8.com/color/96/000000/teamwork.png" class="logo">

        <h2>Team Activity Monitor</h2>
        <p class="subtext">Ask what any team member is currently working on</p>

        <input id="question" placeholder="Ask about a team member..." />

        <button onclick="ask()">Ask</button>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Fetching details...</p>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">✖</span>
            <h3>Team Member Activity</h3>

            <div id="output" class="output-box"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
